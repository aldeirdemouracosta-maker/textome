name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-mcp.txt
      - name: Testes (sem R e sem Ollama)
        run: |
          python test_cache.py
          python test_e2e_mock.py
          python test_traducao_e_correcoes.py
          python test_cli.py
          python test_limpeza_transcricao.py
          python test_analises.py
          python test_validacao.py
          python test_mcp_triangulacao.py
      - name: Linha de comando (fumaça)
        run: python cli.py config-exemplo

  whisper:
    # Gera fala sintética em português (espeak-ng) e transcreve com o Whisper real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install -r requirements.txt -r requirements-audio.txt
      - name: Transcrever entrevista sintética
        run: |
          mkdir audios
          espeak-ng -v pt-br -s 140 -w audios/ent01.wav \
            "O posto de saúde do meu bairro está sempre lotado. A gente espera muitas horas para ser atendido."
          printf 'arquivo;sexo;bairro\nent01.wav;F;Centro\n' > participantes.csv
          python cli.py transcrever audios --variaveis participantes.csv \
            --modelo-whisper base --idioma pt --saida corpus_entrevistas.txt
          cat corpus_entrevistas.txt
          grep -q '^\*\*\*\* \*ent_ent01 \*sexo_f \*bairro_centro$' corpus_entrevistas.txt
          grep -qiE 'sa[uú]de|bairro|lotado|atendid' corpus_entrevistas.txt

  bertopic:
    # BERTopic real (embeddings multilíngues) no corpus de exemplo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-topicos.txt
      - name: Triangulação no corpus de exemplo
        run: python exemplos/teste_bertopic.py

  docker:
    # Constrói a imagem (R + rainette + Python) e roda uma análise real
    # da CHD no corpus de exemplo, com LLM simulado.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t textome .
      - name: Análise completa no corpus de exemplo
        run: |
          mkdir -p saida && chmod 777 saida
          docker run --rm -v "$PWD/saida:/saida" textome \
            python cli.py run exemplos/corpus_demo.txt --mock --k 4 --saida /saida
          cat saida/relatorio.md
          ls -la saida/figuras
          test -s saida/figuras/dendrograma.png   # dendrograma real do rainette
          test -s saida/figuras/afc.png
          test -s saida/relatorio.docx
          python3 -c "import json; d = json.load(open('saida/classes.json')); n = len(d['todos_segmentos']); print('segmentos exportados do R:', n); assert n > 0 and all(s['classe'] >= 0 for s in d['todos_segmentos'])"
      - name: Análise completa pelo protocolo MCP (servidor stdio + R real)
        run: |
          docker run --rm textome python exemplos/cliente_mcp.py exemplos/corpus_demo.txt --mock --k 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-exemplo
          path: saida/
